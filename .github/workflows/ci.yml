name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only token: this workflow never needs to write to the repository.
permissions:
  contents: read

# A newer push to the same branch or PR cancels the run that is still going.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # Oldest supported version (see "engines" in package.json) and the current LTS.
        node: ['24.12.0', '26']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - name: Unit and CLI tests
        run: npm test
      - name: Build the example card
        run: npm run build
      - name: Check that the generated SVGs are well-formed XML
        run: |
          python3 - <<'PY'
          import glob, sys
          from xml.dom import minidom
          files = sorted(glob.glob('dist/*.svg'))
          assert len(files) == 2, f'expected 2 SVGs, found {files}'
          for f in files:
              minidom.parse(f)
              print('ok', f)
          PY

  examples:
    name: Example images are up to date
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Regenerate docs/ and check that nothing changed
        run: |
          npm run docs
          if [ -n "$(git status --porcelain -- docs)" ]; then
            git status --short -- docs
            echo "::error::docs/ is stale. Run: npm run docs"
            exit 1
          fi
