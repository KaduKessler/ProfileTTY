name: Bug report
description: Something does not work or the card looks wrong
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What did you expect, and what did you get instead?
    validations:
      required: true
  - type: textarea
    id: profile
    attributes:
      label: Profile JSON
      description: The JSON you used. Remove anything private.
      render: json
  - type: textarea
    id: command
    attributes:
      label: Command and error
      description: The command you ran and the full error message, if any.
      render: shell
  - type: input
    id: node
    attributes:
      label: Node.js version
      description: Output of `node --version`.
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
